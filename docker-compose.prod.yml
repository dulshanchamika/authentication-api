services:
  # 1. Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: auth-backend-prod
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    env_file:
      - ./.env.production
    restart: always
    networks:
      - app-network

  # 2. Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: auth-frontend-prod
    ports:
      - '${FRONTEND_PORT:-80}:80'
    env_file:
      - ./.env.production
    environment:
      - VITE_API_URL=${VITE_API_URL}
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
